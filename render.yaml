services:
  - type: web
    name: exvis-beatz
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production node server.ts
    healthCheckPath: /api/health
    disk:
      name: exvis-beatz-storage
      mountPath: /var/data
      sizeGB: 25
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.2"
      - key: FORCE_HTTPS
        value: "true"
      - key: APP_URL
        value: https://exvisbeatz.com
      - key: PERSISTENT_STORAGE_DIR
        value: /var/data
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_SUBACCOUNT_CODE
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Exvis Beatz <enockgyamfi614@gmail.com>"
